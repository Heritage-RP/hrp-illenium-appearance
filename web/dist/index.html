<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI</title>
  <style>
    /* heritage theme (shared/theme.lua), on when the server's UI theme is heritage: see the script below */

    /* Terminal glow for containers */
    body.heritage-theme [class*="container"],
    body.heritage-theme [class*="section"],
    body.heritage-theme [class*="modal"],
    body.heritage-theme [class*="wrapper"] {
      box-shadow: 0 0 20px rgba(26, 255, 128, 0.2), inset 0 0 10px rgba(26, 255, 128, 0.03);
      border-color: rgba(26, 255, 128, 0.3) !important;
    }

    /* Text glow effect */
    body.heritage-theme h1,
    body.heritage-theme h2,
    body.heritage-theme h3,
    body.heritage-theme [class*="title"],
    body.heritage-theme [class*="header"] {
      text-shadow: 0 0 5px rgba(26, 255, 128, 0.4), 0 0 10px rgba(26, 255, 128, 0.2);
    }

    /* Terminal scrollbar */
    body.heritage-theme ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    body.heritage-theme ::-webkit-scrollbar-track {
      background: rgba(5, 15, 8, 0.95);
      border: 1px solid rgba(13, 122, 62, 0.5);
    }

    body.heritage-theme ::-webkit-scrollbar-thumb {
      background: rgba(13, 122, 62, 0.8);
      border: 1px solid rgba(26, 255, 128, 0.5);
    }

    body.heritage-theme ::-webkit-scrollbar-thumb:hover {
      background: rgba(26, 255, 128, 0.8);
    }

    /* Button hover glow */
    body.heritage-theme button:hover,
    body.heritage-theme [class*="btn"]:hover {
      box-shadow: 0 0 15px rgba(26, 255, 128, 0.4);
    }
  </style>
  <script type="module" crossorigin src="./assets/index.8ec35e48.js"></script>
  <script>
    // The theme configuration the menu itself fetches (game/nui.lua, get_theme_configuration): when its current theme is
    // heritage (server convar hrp_ui_theme), load its font and turn on the heritage-theme rules above. Any other theme
    // leaves the page as upstream ships it.
    (function () {
      var HERITAGE = 'heritage';
      var TRIES = 10;
      var RETRY_MS = 500;

      function applyHeritage() {
        var fonts = [
          ['preconnect', 'https://fonts.googleapis.com'],
          ['preconnect', 'https://fonts.gstatic.com'],
          ['stylesheet', 'https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap']
        ];
        fonts.forEach(function (font) {
          var link = document.createElement('link');
          link.rel = font[0];
          link.href = font[1];
          if (font[1].indexOf('gstatic') !== -1) link.crossOrigin = '';
          document.head.appendChild(link);
        });
        document.body.classList.add('heritage-theme');
      }

      function whenReady(fn) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
        else fn();
      }

      function load(triesLeft) {
        var resource = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'illenium-appearance';
        fetch('https://' + resource + '/get_theme_configuration', {
          method: 'post',
          headers: { 'Content-type': 'application/json; charset=UTF-8' },
          body: '{}'
        })
          .then(function (response) { return response.json(); })
          .then(function (theme) {
            if (theme && theme.currentTheme === HERITAGE) whenReady(applyHeritage);
          })
          .catch(function () {
            // The client script may not have registered the callback yet
            if (triesLeft > 1) setTimeout(function () { load(triesLeft - 1); }, RETRY_MS);
          });
      }

      load(TRIES);
    })();
  </script>
</head>

<body>
  <div id="root"></div>

</body>

</html>
