<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI</title>
  <style>
    /* Themed look, on when the server's UI theme is a theme a resource declares (game/declared_theme.lua): drawn with
       the --hrp-* tokens of that theme's stylesheet, loaded by the script below. Neutral leaves the upstream look. */

    /* Glow for containers */
    body.hrp-themed [class*="container"],
    body.hrp-themed [class*="section"],
    body.hrp-themed [class*="modal"],
    body.hrp-themed [class*="wrapper"] {
      box-shadow: var(--hrp-shadow);
      border-color: var(--hrp-border) !important;
    }

    /* Text glow effect */
    body.hrp-themed h1,
    body.hrp-themed h2,
    body.hrp-themed h3,
    body.hrp-themed [class*="title"],
    body.hrp-themed [class*="header"] {
      text-shadow: var(--hrp-glow);
    }

    /* Scrollbar */
    body.hrp-themed ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    body.hrp-themed ::-webkit-scrollbar-track {
      background: var(--hrp-bg-sunken);
      border: 1px solid var(--hrp-border);
    }

    body.hrp-themed ::-webkit-scrollbar-thumb {
      background: var(--hrp-border-strong);
      border: 1px solid var(--hrp-accent);
    }

    body.hrp-themed ::-webkit-scrollbar-thumb:hover {
      background: var(--hrp-accent);
    }

    /* Button hover glow */
    body.hrp-themed button:hover,
    body.hrp-themed [class*="btn"]:hover {
      box-shadow: 0 0 15px var(--hrp-accent-glow);
    }
  </style>
  <script type="module" crossorigin src="./assets/index.dd72be62.js"></script>
  <script>
    // The theme configuration the menu itself fetches (game/nui.lua, get_theme_configuration): when the server's UI
    // theme is a declared one (uiTheme.stylesheet), load its stylesheet (tokens and fonts), set data-theme and turn on
    // the themed rules above. Neutral leaves the page as upstream ships it.
    (function () {
      var TRIES = 10;
      var RETRY_MS = 500;

      function applyTheme(uiTheme) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = uiTheme.stylesheet;
        link.setAttribute('data-hrp-theme', uiTheme.theme);
        document.head.appendChild(link);
        document.documentElement.setAttribute('data-theme', uiTheme.theme);
        document.body.classList.add('hrp-themed');
      }

      function whenReady(fn) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
        else fn();
      }

      function load(triesLeft) {
        var resource = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'illenium-appearance';
        fetch('https://' + resource + '/get_theme_configuration', {
          method: 'post',
          headers: { 'Content-type': 'application/json; charset=UTF-8' },
          body: '{}'
        })
          .then(function (response) { return response.json(); })
          .then(function (configuration) {
            var uiTheme = configuration && configuration.uiTheme;
            if (uiTheme && typeof uiTheme.stylesheet === 'string' && uiTheme.stylesheet !== '') {
              whenReady(function () { applyTheme(uiTheme); });
            }
          })
          .catch(function () {
            // The client script may not have registered the callback yet
            if (triesLeft > 1) setTimeout(function () { load(triesLeft - 1); }, RETRY_MS);
          });
      }

      load(TRIES);
    })();
  </script>
</head>

<body>
  <div id="root"></div>

</body>

</html>
